name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: mobility_db
          POSTGRES_USER: mobility_user
          POSTGRES_PASSWORD: mobility_pass
        ports:
          - 5434:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            api/requirements.txt
            pipelines/requirements.txt

      - name: Install Python dependencies
        run: |
          pip install -r api/requirements.txt -r pipelines/requirements.txt
          pip install ruff pytest

      - name: Apply DB migrations
        env:
          PGPASSWORD: mobility_pass
        run: |
          for f in database/migrations/*.sql; do
            psql -v ON_ERROR_STOP=1 -h localhost -p 5434 -U mobility_user -d mobility_db -f "$f"
          done

      - name: Lint
        run: ruff check api/ pipelines/ spatial/ tests/

      - name: Run tests
        env:
          DATABASE_URL: postgresql://mobility_user:mobility_pass@localhost:5434/mobility_db
        run: pytest tests/ -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
